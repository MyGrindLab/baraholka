<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#grad)"/>

  <!-- Shopping bag icon -->
  <g transform="translate(25, 20)">
    <!-- Bag body -->
    <rect x="5" y="15" width="40" height="50" rx="3" fill="white" opacity="0.9"/>

    <!-- Bag handle -->
    <path d="M 15 15 Q 15 5, 25 5 Q 35 5, 35 15"
          fill="none"
          stroke="white"
          stroke-width="3"
          opacity="0.9"/>

    <!-- Price tag -->
    <circle cx="35" cy="35" r="8" fill="#FFD700"/>
    <text x="35" y="39" text-anchor="middle" font-size="12" font-weight="bold" fill="#667eea">$</text>
  </g>

  <!-- Letter B (Baraholka) -->
  <text x="50" y="75" text-anchor="middle" font-size="35" font-weight="bold" fill="white" font-family="Arial, sans-serif">B</text>
</svg>
