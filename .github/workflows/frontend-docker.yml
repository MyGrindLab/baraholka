name: Build and Push Baraholka frontend image

on:
  push:
    branches: [ "master" ]
    paths:
      - 'frontend/**'
      - 'infrastructure/frontend/Dockerfile'
      - '.github/workflows/frontend-docker.yml'
  workflow_dispatch:

concurrency:
  group: baraholka-frontend-image-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build and Push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - id: vars
      run: echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push image
      uses: docker/build-push-action@v5
      with:
        context: frontend
        file: infrastructure/frontend/Dockerfile
        tags: |
          ghcr.io/mygrindlab/baraholka-frontend:${{ github.sha }}
          ghcr.io/mygrindlab/baraholka-frontend:latest
        push: true
        cache-from: type=gha,scope=${{ github.ref }}-frontend
        cache-to: type=gha,mode=max,scope=${{ github.ref }}-frontend

  deploy:
    name: Write image tag to GitOps repo
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: MyGrindLab/argo-cd
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          ref: master

      - name: Update image tag
        run: |
          set -euo pipefail
          command -v yq >/dev/null || {
            sudo curl -fsSL -o /usr/local/bin/yq \
              https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          }
          FILE=apps/baraholka/kustomization.yaml
          OLD=$(yq '(.images[] | select(.name == "ghcr.io/mygrindlab/baraholka-frontend")).newTag' "$FILE")
          yq -i '(.images[] | select(.name == "ghcr.io/mygrindlab/baraholka-frontend")).newTag = "${{ needs.build.outputs.sha }}"' "$FILE"
          echo "frontend image tag: $OLD -> ${{ needs.build.outputs.sha }}"
          git diff --stat

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  "baraholka-ci[bot]"
          git config user.email "ci@baraholka.invalid"
          if git diff --quiet; then
            echo "tag unchanged - nothing to deploy"; exit 0
          fi
          git add apps/baraholka/kustomization.yaml
          git commit -m "frontend: deploy ${{ needs.build.outputs.sha }}

          Automated image tag update from ${{ github.repository }}@${{ github.sha }}.
          Roll back by reverting this commit — Argo will sync the previous image."
          git push origin master || { git pull --rebase origin master && git push origin master; }
